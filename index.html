
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My First Web GIS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body {
font-family: system-ui, sans-serif;
margin: 0;
padding: 0 24px 18px;
background: #f4f6f8;
color: #13293d;
}
.header {
display: flex;
align-items: center;
gap: 16px;
padding: 16px 0 12px;
border-bottom: 1px solid #d4dce4;
}
.header img {
width: 76px;
height: 76px;
object-fit: contain;
}
.header-copy { flex: 1; }
h1 {
margin: 0 0 4px;
color: #0b2545;
}
.subtitle {
color: #5a6b7b;
margin-top: 0;
}
#map {
height: 480px;
width: 100%;
border-radius: 8px;
}
.credit {
margin: 12px 0 0;
text-align: right;
font-size: 13px;
color: #5a6b7b;
}
</style>
</head>
<body>
<header class="header">
<img src="nust-seal.jpg" alt="National University of Sciences and Technology seal">
<div class="header-copy">
<h1>Islamabad</h1>
<p class="subtitle">Web GIS, Lab 01. IGIS, NUST.</p>
</div>
</header>
<div id="map"></div>
<p class="credit">Made by: Muhammad Amjad</p>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([33.6844, 73.0479], 12);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
maxZoom: 19,
attribution: 'Tiles &copy; Esri'
}).addTo(map);
L.marker([33.6423, 72.9906])
.addTo(map)
.bindPopup('NUST H-12, Islamabad')
.openPopup();
</script>
</body>
</html>
